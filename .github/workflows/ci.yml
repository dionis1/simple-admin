name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simple_admin_testing
          POSTGRES_USER: simple_admin
          POSTGRES_PASSWORD: local-only-change-me
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U simple_admin -d simple_admin_testing"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: simple_admin_testing
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, mbstring
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: composer audit --locked --no-interaction
      - run: php artisan migrate --force
      - run: php artisan view:cache
      - run: composer check
      - name: Redis connectivity
        run: php artisan app:check-redis
